<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Update Book - Book Logger</title>
        <meta name="description" content="Web application for logging books read and books that are wished for.">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../css/styles.css">
        <link rel="stylesheet" href="../css/bookform.css">
        <link rel="stylesheet" type="text/css" href="//fonts.googleapis.com/css?family=Alice" />
        <link rel="apple-touch-icon" sizes="180x180" href="../../assets/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="../../assets/favicon-16x16.png">
        <link rel="manifest" href="../../assets/site.webmanifest">
    </head>
    <body>
        <button id="back">←</button>
        <h1><span class="bold">Update Book</span></h1>

        <form id="book-form" method="POST">

            <div id="main-section">
                <label for="book-name">Book Name:
                    <input required type="text" id="book-name" name="book-name">
                </label>
                <label for="author-name">Author:
                    <input required type="text" id="author-name" name="author-name">
                </label>
                <label for="reading">Are you currently reading this book?
                    <input required type="checkbox" id="reading" name="reading">
                </label>
                <label for="cover">Cover Image (OPTIONAL):
                    <input type="file" accept="image/*" id="cover" name="cover">
                </label>
                <img id="cover-preview" src="">
            </div>

            <div id="bought-values" aria-hidden="true">
                <label for="date-bought" hidden>Date Bought:
                    <input disabled type="date" name="date-bought" id="date-bought">
                </label>
                <label for="bought-from" hidden>Location Bought (OPTIONAL):
                    <input disabled type="date" name="bought-from" id="bought-from">
                </label>
            </div>

            <div id="borrowed-values" aria-hidden="true">
                <label for="date-borrowed" hidden>Date Borrowed:
                    <input disabled type="date" name="date-borrowed" id="date-borrowed">
                </label>
                <label for="returned" hidden>Returned:
                    <input disabled required type="checkbox" id="returned" name="returned">
                </label>
                <label for="date-returned" hidden>Date Returned (OPTIONAL):
                    <input disabled type="date" name="date-returned" id="date-returned">
                </label>
                <label for="borrowed-from" hidden>Location Borrowed From (OPTIONAL):
                    <input disabled type="text" name="borrowed-from" id="borrowed-from">
                </label>
            </div>

            <button type="submit">Update Book</button>
            <button disabled aria-hidden="true" id="move-book">Move To Log</button>
            <button id="remove-book">REMOVE BOOK</button>

        </form>

        <script type="module" src="../../dist/script/addbook.js" defer></script>
    </body>
</html>
